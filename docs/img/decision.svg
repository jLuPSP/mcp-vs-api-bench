<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1138" height="658" rx="12" fill="#0b0e14" stroke="#1e2733"/>
  <text x="40" y="38" fill="#cdd6e4" font-size="15" font-weight="700">which one, and where to run it</text>
  <text x="40" y="58" fill="#8a97a8" font-size="12">answer top to bottom. the first gate decided more in this benchmark than the branch below it.</text>

  <!-- start -->
  <rect x="470" y="82" width="200" height="38" rx="19" fill="#11161f" stroke="#2b3947"/>
  <text x="570" y="106" text-anchor="middle" fill="#cdd6e4" font-size="12.5">an agent needs tools</text>
  <line x1="570" y1="120" x2="570" y2="146" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>

  <!-- gate 1: curation, applies to both -->
  <rect x="250" y="152" width="640" height="62" rx="9" fill="#0f1a13" stroke="#4ade80"/>
  <text x="570" y="177" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">first: load only the tools the task needs</text>
  <text x="570" y="197" text-anchor="middle" fill="#9fceb0" font-size="11.5">applies to both architectures. costs 4x and 45 points of success if you skip it.</text>
  <line x1="570" y1="214" x2="570" y2="240" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>

  <!-- decision 1: how many pairs -->
  <polygon points="570,246 800,312 570,378 340,312" fill="#11161f" stroke="#6fb3ff"/>
  <text x="570" y="303" text-anchor="middle" fill="#cdd6e4" font-size="13" font-weight="700">how many agents x systems?</text>
  <text x="570" y="323" text-anchor="middle" fill="#8a97a8" font-size="11">counting what you will own in a year</text>

  <!-- left branch: direct -->
  <line x1="340" y1="312" x2="196" y2="312" stroke="#5b6675" stroke-width="1.6"/>
  <line x1="196" y1="312" x2="196" y2="402" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="266" y="303" text-anchor="middle" fill="#8a97a8" font-size="11.5">under ~6 pairs</text>

  <rect x="60" y="408" width="272" height="76" rx="9" fill="#11161f" stroke="#2b3947"/>
  <text x="196" y="436" text-anchor="middle" fill="#cdd6e4" font-size="14" font-weight="700">direct API</text>
  <text x="196" y="457" text-anchor="middle" fill="#8a97a8" font-size="11.5">the gateway is overhead you</text>
  <text x="196" y="473" text-anchor="middle" fill="#8a97a8" font-size="11.5">do not need yet</text>

  <!-- right branch: mcp -->
  <line x1="800" y1="312" x2="944" y2="312" stroke="#5b6675" stroke-width="1.6"/>
  <line x1="944" y1="312" x2="944" y2="402" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="874" y="303" text-anchor="middle" fill="#8a97a8" font-size="11.5">~6 or more</text>

  <rect x="808" y="408" width="272" height="76" rx="9" fill="#11161f" stroke="#6fb3ff"/>
  <text x="944" y="436" text-anchor="middle" fill="#6fb3ff" font-size="14" font-weight="700">MCP</text>
  <text x="944" y="457" text-anchor="middle" fill="#8a97a8" font-size="11.5">one policy change beats</text>
  <text x="944" y="473" text-anchor="middle" fill="#8a97a8" font-size="11.5">N x M of them</text>

  <!-- shortcut: vendor ships a server -->
  <rect x="380" y="408" width="380" height="76" rx="9" fill="#11161f" stroke="#2b3947" stroke-dasharray="5 4"/>
  <text x="570" y="434" text-anchor="middle" fill="#cdd6e4" font-size="12.5">a vendor already ships an MCP server?</text>
  <text x="570" y="455" text-anchor="middle" fill="#8a97a8" font-size="11.5">take it at any count. your build cost for</text>
  <text x="570" y="471" text-anchor="middle" fill="#8a97a8" font-size="11.5">that system is roughly zero.</text>
  <line x1="760" y1="446" x2="802" y2="446" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#fa)"/>

  <!-- decision 2: placement, only under MCP -->
  <line x1="944" y1="484" x2="944" y2="506" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>
  <polygon points="944,512 1096,556 944,600 792,556" fill="#11161f" stroke="#6fb3ff"/>
  <text x="944" y="551" text-anchor="middle" fill="#cdd6e4" font-size="12">more than ~10 calls</text>
  <text x="944" y="568" text-anchor="middle" fill="#cdd6e4" font-size="12">per task, over a WAN?</text>

  <line x1="792" y1="556" x2="700" y2="556" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="746" y="547" text-anchor="middle" fill="#8a97a8" font-size="11">yes</text>
  <rect x="404" y="528" width="290" height="56" rx="9" fill="#11161f" stroke="#2b3947"/>
  <text x="549" y="552" text-anchor="middle" fill="#cdd6e4" font-size="12.5">co-locate: stdio or sidecar</text>
  <text x="549" y="570" text-anchor="middle" fill="#8a97a8" font-size="11">a round trip per call adds up</text>

  <line x1="1020" y1="600" x2="1020" y2="624" stroke="#5b6675" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="1064" y="618" fill="#8a97a8" font-size="11">no</text>
  <text x="1020" y="644" text-anchor="middle" fill="#8a97a8" font-size="12">a central gateway is fine</text>

  <!-- footnote -->
  <text x="60" y="516" fill="#5b6675" font-size="11">the ~6 threshold is arithmetic</text>
  <text x="60" y="532" fill="#5b6675" font-size="11">(A x S vs A + S + gateway),</text>
  <text x="60" y="548" fill="#5b6675" font-size="11">not something this benchmark</text>
  <text x="60" y="564" fill="#5b6675" font-size="11">measured. it never varied</text>
  <text x="60" y="580" fill="#5b6675" font-size="11">agent or system count.</text>
</svg>
