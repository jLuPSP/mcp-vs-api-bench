<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
  <rect x="1" y="1" width="1138" height="438" rx="12" fill="#0b0e14" stroke="#1e2733"/>
  <text x="40" y="38" fill="#8a97a8" font-size="14.5">wrong tool calls need two conditions at once</text>
  <text x="1100" y="38" text-anchor="end" fill="#5b6675" font-size="11.5">deepseek-chat, 54 to 60 distractors loaded</text>

  <!-- column headers -->
  <text x="530" y="86" text-anchor="middle" fill="#8a97a8" font-size="12.5">unrelated tools</text>
  <text x="530" y="103" text-anchor="middle" fill="#5b6675" font-size="11">HR, finance, calendar</text>
  <text x="886" y="86" text-anchor="middle" fill="#8a97a8" font-size="12.5">lookalike tools</text>
  <text x="886" y="103" text-anchor="middle" fill="#5b6675" font-size="11">list_incidents, list_cases</text>

  <!-- row labels -->
  <text x="330" y="176" text-anchor="end" fill="#cdd6e4" font-size="13" font-weight="700">explicit request</text>
  <text x="330" y="196" text-anchor="end" fill="#5b6675" font-size="10.5">"open P1 tickets"</text>
  <text x="330" y="320" text-anchor="end" fill="#cdd6e4" font-size="13" font-weight="700">vague request</text>
  <text x="330" y="340" text-anchor="end" fill="#5b6675" font-size="10.5">"whoever has the pager"</text>

  <!-- explicit / unrelated -->
  <rect x="360" y="120" width="340" height="112" rx="9" fill="#0f1a13" stroke="#2b3947"/>
  <text x="530" y="166" text-anchor="middle" fill="#4ade80" font-size="26" font-weight="700">100%</text>
  <text x="530" y="192" text-anchor="middle" fill="#8a97a8" font-size="12">1 wrong-tool call</text>
  <text x="530" y="212" text-anchor="middle" fill="#5b6675" font-size="10.5">n=10 &#183; 60 distractors &#183; 0 were distractors</text>

  <!-- explicit / lookalike -->
  <rect x="716" y="120" width="340" height="112" rx="9" fill="#0f1a13" stroke="#2b3947"/>
  <text x="886" y="166" text-anchor="middle" fill="#4ade80" font-size="26" font-weight="700">100%</text>
  <text x="886" y="192" text-anchor="middle" fill="#8a97a8" font-size="12">0 wrong-tool calls</text>
  <text x="886" y="212" text-anchor="middle" fill="#5b6675" font-size="10.5">n=20 &#183; 54 distractors</text>

  <!-- vague / unrelated -->
  <rect x="360" y="264" width="340" height="112" rx="9" fill="#11161f" stroke="#f0b429"/>
  <text x="530" y="310" text-anchor="middle" fill="#f0b429" font-size="26" font-weight="700">60%</text>
  <text x="530" y="336" text-anchor="middle" fill="#8a97a8" font-size="12">3 wrong-tool calls</text>
  <text x="530" y="356" text-anchor="middle" fill="#5b6675" font-size="10.5">n=10 &#183; 54 distractors &#183; 0 were distractors</text>

  <!-- vague / lookalike -->
  <rect x="716" y="264" width="340" height="112" rx="9" fill="#1c1316" stroke="#f87171"/>
  <text x="886" y="310" text-anchor="middle" fill="#f87171" font-size="26" font-weight="700">60%</text>
  <text x="886" y="336" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">125 wrong-tool calls</text>
  <text x="886" y="356" text-anchor="middle" fill="#cda6a6" font-size="10.5">n=30 &#183; 54 distractors &#183; mostly distractors</text>

  <text x="40" y="418" fill="#5b6675" font-size="12">vague phrasing is what costs the success. the lookalikes are what turn it into wrong calls.</text>
</svg>
