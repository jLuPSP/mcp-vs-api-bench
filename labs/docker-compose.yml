name: lab-mcpbench

# Optional real-remote arm. Runs the same backend and MCP server on a second host so the
# `mcp_remote` measurement crosses a genuine network, which is the check on whether the
# local netem simulation is telling the truth.
#
# Everything is namespaced and labelled so one teardown removes all of it. No host, IP, or
# appdata path appears here: values come from the gitignored unraid.env.

networks:
  labnet: {}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-mcpbench-backend
    labels: ["com.jlu.lab=mcpbench"]
    networks: [labnet]
    command: python -m bench.backend.app
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "9113"
      BENCH_SEED: ${BENCH_SEED:-1729}
      BACKEND_LATENCY_MS: ${BACKEND_LATENCY_MS:-40}
      BACKEND_JITTER_MS: ${BACKEND_JITTER_MS:-0}
    ports:
      - "9113:9113"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9113/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-mcpbench-mcp
    labels: ["com.jlu.lab=mcpbench"]
    networks: [labnet]
    command: python -m bench.mcpserver.server --transport http --host 0.0.0.0 --port 9114
    environment:
      BACKEND_URL: http://backend:9113
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9114"
    ports:
      - "9114:9114"
    depends_on:
      backend:
        condition: service_healthy
